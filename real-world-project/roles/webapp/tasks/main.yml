- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Create application directory
  file:
    path: "{{ app_directory }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Deploy application page
  template:
    src: index.html.j2
    dest: "{{ app_directory }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"

- name: Deploy Nginx configuration
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/devops-app.conf
  notify: Restart Nginx

- name: Enable application configuration
  file:
    src: /etc/nginx/sites-available/devops-app.conf
    dest: /etc/nginx/sites-enabled/devops-app.conf
    state: link
    force: yes
  notify: Restart Nginx

- name: Remove default Nginx configuration
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart Nginx

- name: Ensure Nginx is running
  service:
    name: nginx
    state: started
    enabled: yes
