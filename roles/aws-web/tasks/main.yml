
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Deploy web page
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
  notify: Restart Nginx

- name: Ensure Nginx is running
  service:
    name: nginx
    state: started
    enabled: yes
