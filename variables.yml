- name: Variable Practice
  hosts: all

  vars:
    app_name: myapp
    app_directory: /tmp/myapp
    app_message: "Application deployed using Ansible"

  tasks:
    - name: Create application directory
      file:
        path: "{{ app_directory }}"
        state: directory

    - name: Create application file
      copy:
        content: "{{ app_message }}\n"
        dest: "{{ app_directory }}/app.txt"